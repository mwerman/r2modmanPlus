name: r2modman Flatpak arm64
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools flatpak flatpak-builder
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec quasar build -m electron -T linux
        continue-on-error: true
      - name: Write manifest
        run: |
          cat > flatpak-r2modman.yml <<'EOF'
          app-id: local.dev.R2modman
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          base: org.electronjs.Electron2.BaseApp
          base-version: '24.08'
          command: r2modman-launch
          finish-args:
            - --share=ipc
            - --share=network
            - --socket=x11
            - --socket=wayland
            - --socket=pulseaudio
            - --device=dri
            - --filesystem=~/.local/share/Steam
            - --filesystem=~/.steam
            - --filesystem=/run/media
          modules:
            - name: r2modman
              buildsystem: simple
              build-commands:
                - mkdir -p /app/r2modman
                - cp -r app/. /app/r2modman/
                - install -Dm755 r2modman-launch /app/bin/r2modman-launch
                - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/local.dev.R2modman.png
                - install -Dm644 r2modman.desktop /app/share/applications/local.dev.R2modman.desktop
              sources:
                - type: dir
                  path: dist/electron/Packaged/linux-arm64-unpacked
                  dest: app
                - type: script
                  dest-filename: r2modman-launch
                  commands:
                    - exec zypak-wrapper /app/r2modman/r2modman "$@"
                - type: file
                  path: src/assets/icon/256x256.png
                  dest-filename: icon.png
                - type: inline
                  dest-filename: r2modman.desktop
                  contents: |
                    [Desktop Entry]
                    Type=Application
                    Name=r2modman
                    Exec=r2modman-launch
                    Icon=local.dev.R2modman
                    Categories=Game;
          EOF
      - name: Build flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --arch=aarch64 --force-clean --disable-rofiles-fuse --install-deps-from=flathub --repo=repo build-dir flatpak-r2modman.yml
          flatpak build-bundle --arch=aarch64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo r2modman-arm64.flatpak local.dev.R2modman
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: r2modman-flatpak-arm64
          files: r2modman-arm64.flatpak
